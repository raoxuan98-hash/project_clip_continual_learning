run:
  seed: 42
  execution_mode: cpu_smoke_only

model:
  id: Qwen/Qwen3-0.6B
  source_id: Qwen/Qwen3-0.6B
  checkpoint_type: instruct
  local_files_only: true
  enable_thinking: false

adapter:
  rank: 8
  alpha: 8
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  filter:
    energy_fraction: 0.20
    leakage: 0.02
    ridge: 0.0001

calibration:
  dataset: nq_open
  revision: 5dd9790a83002ad084ddeb7c420dc716852c6f28
  samples: 2
  seed: 233
  batch_size: 2
  max_sequence_length: 128
  include_non_padding_tokens: true

train:
  dataset: metamathqa
  revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
  first_n: 2
  max_sequence_length: 128
  epochs: 1
  per_device_batch_size: 1
  global_batch_size: 1
  optimizer: adamw
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  max_grad_norm: 1.0
  learning_rate: 0.00002
  weight_decay: 0.0
  scheduler: cosine
  warmup_ratio: 0.0
  response_only_loss: true
  precision: fp32
  gradient_checkpointing: false

evaluation:
  downstream: []
  retention: []
