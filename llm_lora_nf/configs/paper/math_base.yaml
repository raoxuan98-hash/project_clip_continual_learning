run:
  seed: 42
  execution_mode: gpu_formal

model:
  id: meta-llama/Llama-3.2-3B-Instruct
  source_id: LLM-Research/Llama-3.2-3B-Instruct
  checkpoint_type: instruct
  local_files_only: true
  enable_thinking: false

adapter:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  filter:
    energy_fraction: 0.20
    leakage: 0.02
    ridge: 0.0001

calibration:
  dataset: nq_open
  revision: 5dd9790a83002ad084ddeb7c420dc716852c6f28
  samples: 256
  seed: 233
  batch_size: 8
  max_sequence_length: 1024
  include_non_padding_tokens: true

train:
  dataset: metamathqa
  revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
  first_n: 100000
  max_sequence_length: 512
  epochs: 1
  per_device_batch_size: 1
  global_batch_size: 128
  optimizer: adamw
  learning_rate: 0.00002
  weight_decay: 0.0
  scheduler: cosine
  warmup_ratio: 0.03
  response_only_loss: true
  precision: bf16
  gradient_checkpointing: true

evaluation:
  downstream: [gsm8k, math]
  retention: [triviaqa, nq_open, webqs]
