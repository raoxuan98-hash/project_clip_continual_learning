  triviaqa: exact_match,remove_whitespace
  nq_open: exact_match,remove_whitespace
  webqs: exact_match,none

runtime:
  batch_size: auto
  max_batch_size: 8
  dtype: float32
  log_samples: true
  cache_requests: true

