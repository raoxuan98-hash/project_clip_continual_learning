  execution_mode: gpu_formal

evaluator:
  repository: EleutherAI/lm-evaluation-harness
  revision: 6d642546f4688648fced259eb3302efd36ece5af
  version: v0.4.12
  seeds:
    random: 0
    numpy: 1234
    torch: 1234
    fewshot: 1234

prompt:
  apply_chat_template: true
  fewshot_as_multiturn: true
  enable_thinking: false

tasks:
  downstream:
    - gsm8k_cot
    - minerva_math500
  retention:
    - triviaqa
    - nq_open
    - webqs

metrics:
